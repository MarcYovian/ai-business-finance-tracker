<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <!--
      SEO Best Practices
      - Title Tag: Concise and descriptive.
      - Meta Description: A compelling summary of the page content.
      - Canonical Tag: Specifies the preferred URL to avoid duplicate content.
      - Robots Tag: Instructs search engines on how to crawl or index the page.
      - Open Graph & Twitter Cards: Enhance social media sharing previews.
      - Structured Data (JSON-LD): Provides explicit context to search engines.
    -->

    <title>AI-Fi Tracker - AI-Powered Business Finance Management</title>
    <meta
      name="description"
      content="Take control of your finances with AI-Fi Tracker. A smart, AI-powered application for efficient income, expense, and budget management. Get intelligent insights to grow your business."
    />
    <meta
      name="keywords"
      content="finance tracker, business finance, expense management, income tracker, budget planner, AI finance, financial insights, money manager"
    />
    <meta name="author" content="Marcellinus Yovian" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ai-fi.marcyovian.my.id/" />
    <meta name="theme-color" content="#1e40af" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ai-fi.marcyovian.my.id/" />
    <meta
      property="og:title"
      content="AI-Fi Tracker - AI-Powered Business Finance Management"
    />
    <meta
      property="og:description"
      content="Manage your business finances efficiently with AI-powered insights, budgeting, and transaction tracking."
    />
    <meta property="og:image" content="/images/preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ai-fi.marcyovian.my.id/" />
    <meta
      name="twitter:title"
      content="AI-Fi Tracker - AI-Powered Business Finance Management"
    />
    <meta
      name="twitter:description"
      content="Manage your business finances efficiently with AI-powered insights, budgeting, and transaction tracking."
    />
    <meta name="twitter:image" content="/images/preview.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "AI-Fi Tracker",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "A smart finance application to manage income, expenses, and fund transfers efficiently with AI-powered insights.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Marcellinus Yovian"
        }
      }
    </script>
  </head>
